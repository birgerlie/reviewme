name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-dependencies:
    name: Update Poetry Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '1.7.1'

      - name: Update dependencies
        run: |
          poetry update
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet poetry.lock; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: Update dependencies'
          title: 'chore: Weekly dependency updates'
          body: |
            ## Automated Dependency Update

            This PR updates project dependencies to their latest compatible versions.

            ### Changes
            - Updated `poetry.lock` with latest compatible versions
            - Exported updated `requirements.txt`

            ### Testing
            - [ ] All CI tests pass
            - [ ] Review updated dependencies for breaking changes
            - [ ] Check security vulnerabilities are addressed

            **Auto-generated by GitHub Actions**
          branch: deps/weekly-update-${{ github.run_number }}
          base: develop
          labels: |
            dependencies
            automated
